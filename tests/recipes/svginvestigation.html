<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>Max Width on Replaced Elements using %</title>
    <link rel="manifest" href="/manifest.json">
    <script src="../../Recipe.min.js"></script>
    <!-- SVG as a CSS image -->
    <style>
        #borderimg { 
            border: 10px solid transparent;
            border-image: url(startupshell.svg) 30 round;
        }
    </style>
</head>
<body>
    

<p id="borderimg">This is text with a SVG border image</p>

<!-- SVG as an HTML image -->
<img src="startupshell.svg"> 


<!-- Inline SVG -->
<svg width="100" height="100">
  <circle cx="50" cy="50" r="40" stroke="green" stroke-width="4" fill="yellow" />
</svg>


</body>
</html>
